name = "pbs-loader-web"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist/pbs-loader-web/browser"

# O database_id real sai de "npx wrangler d1 create pbs-loader-web" (ver README). Para rodar local, qualquer id
# serve: o D1 local fica em .wrangler/.
[[d1_databases]]
binding = "DB"
database_name = "pbs-loader-web"
database_id = "5f61aad8-91ed-44b7-bfaf-18ae90e8e7e4"
migrations_dir = "migrations"

[vars]
CATALOG_URL = "https://sebola3461.github.io/pbs-loader-catalogo/community-catalog.json"
TURNSTILE_SITE_KEY = "0x4AAAAAAFuZKzOVidgelTKM"
# Itens do PBKDF2 no hash de senha: 600k estoura o limite de CPU do plano free do Pages; com isso o
# cadastro morre com 500. O formato da hash guarda as iterações usadas, então contas criadas aqui
# continuam válidas se o número subir no futuro.
PBKDF2_ITERATIONS = "100000"
