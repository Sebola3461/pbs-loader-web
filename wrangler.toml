name = "pbs-loader-web"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist/pbs-loader-web/browser"

# O database_id real sai de "npx wrangler d1 create pbs-loader-web" (ver README). Para rodar local, qualquer id
# serve: o D1 local fica em .wrangler/.
[[d1_databases]]
binding = "DB"
database_name = "pbs-loader-web"
database_id = "5f61aad8-91ed-44b7-bfaf-18ae90e8e7e4"
migrations_dir = "migrations"

[vars]
CATALOG_URL = "https://sebola3461.github.io/pbs-loader-catalogo/community-catalog.json"
# Chave pública do Turnstile (vai para o navegador). Esta é a chave de teste (sempre passa):
# na produção, substitua no painel do Pages pelas chaves reais do domínio.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
# A chave SECRETA nunca vai aqui no repositório: em dev ela fica em .dev.vars (não versionado);
# na produção, configure como variável cifrada/secret no painel do Pages.
