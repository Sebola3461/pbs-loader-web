<article class="card">
  <div class="cover" aria-hidden="true">
    @if (coverUrl(); as url) {
      <img [src]="url" alt="" width="640" height="360" loading="lazy" decoding="async" />
    } @else {
      <span class="cover-placeholder">{{ typeLabel() }}</span>
    }
  </div>
  <div class="body">
    <h3 class="title">
      <a [routerLink]="['/mods', mod().id]" class="stretched">{{ mod().nome }}</a>
    </h3>
    <p class="author">
      por <a [routerLink]="['/autores', authorSlug()]" class="author-link">{{ mod().autor }}</a>
    </p>
    <p class="description">{{ mod().descricao }}</p>
    <ul class="tags" aria-label="Detalhes">
      <li class="tag">{{ typeLabel() }}</li>
      @if (mod().confiavel) {
        <li class="tag tag-trusted">Autor confiável</li>
      }
      @if (mod().origem === 'externa') {
        <li class="tag tag-external">Link externo</li>
      }
    </ul>
    <p class="meta">Atualizado em {{ updated() }}</p>
  </div>
</article>
